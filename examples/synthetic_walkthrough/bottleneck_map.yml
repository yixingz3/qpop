# SYNTHETIC domain map — every entity below is fictional (see README).
# One node is enough to walk the full pipeline; real maps carry many.
domain: uhp_neon_recycling   # ultra-high-purity neon reclaim for lithography (synthetic)
nodes:
  - id: neon_reclaim_skids
    rationale: >
      Lithography excimer lasers consume UHP neon; reclaim/purification skids that
      re-qualify vented gas to 99.999% are capacity-constrained and certification-gated.
      (SYNTHETIC pedagogical node.)
    # Scores are assigned at EVALUATE time against the released discrete rubric
    # (src/scoring_rubric.md); this walkthrough's single source of numeric truth
    # is run_walkthrough.py — the YAML carries structure and triggers only.
    exit_triggers:
      - id: capacity_glut
        metric: "announced reclaim capacity additions vs installed base"
        op: ">"
        threshold: "25% within 12 months"
        data_source: { name: "OEM press releases + industry capacity tracker", tier: secondary }
      - id: substitution_breakthrough
        metric: "qualified laser platform running sub-99.99% neon or neon-free"
        op: "exists"
        data_source: { name: "litho OEM technical disclosures", tier: primary }
      - id: crowding_reversal
        metric: "price vs estimate-revision gap"
        op: ">"
        threshold: "2 sigma"
        data_source: { name: "market data", tier: market_implied }
